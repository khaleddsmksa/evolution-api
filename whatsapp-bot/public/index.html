<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>" />
  <title>لوحة تحكم بوت واتساب — Evolution API</title>
  <style>
    :root {
      --bg: #0e1621; --panel: #17212b; --panel2: #1e2c3a;
      --accent: #25d366; --accent2: #128c7e; --text: #e9edef; --muted: #8696a0;
      --border: #2a3942;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, system-ui, sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
    }
    header {
      background: var(--accent2); padding: 16px 24px; display: flex;
      align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    }
    header h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
    .badge { padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: 600; }
    .badge.on { background: var(--accent); color: #04210f; }
    .badge.off { background: #5a2a2a; color: #ffb4b4; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; display: grid; gap: 20px; grid-template-columns: 1fr 1fr; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .card h2 { font-size: 16px; margin-bottom: 16px; color: var(--accent); }
    .full { grid-column: 1 / -1; }
    .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; }
    .stat { background: var(--panel2); border-radius: 10px; padding: 16px; text-align: center; }
    .stat .num { font-size: 28px; font-weight: 700; color: var(--accent); }
    .stat .lbl { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .chat { background: var(--panel2); border-radius: 10px; height: 320px; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 80%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .msg.user { background: var(--panel); align-self: flex-start; border-bottom-right-radius: 2px; }
    .msg.bot { background: var(--accent2); align-self: flex-end; border-bottom-left-radius: 2px; }
    .input-row { display: flex; gap: 8px; margin-top: 12px; }
    input, button { font-family: inherit; font-size: 14px; border-radius: 8px; border: 1px solid var(--border); }
    input { flex: 1; padding: 10px 14px; background: var(--panel2); color: var(--text); }
    input:focus { outline: none; border-color: var(--accent); }
    button { padding: 10px 18px; background: var(--accent); color: #04210f; font-weight: 600; cursor: pointer; border: none; }
    button:hover { background: #1fb858; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: right; padding: 8px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; }
    .pill { padding: 2px 8px; border-radius: 8px; background: var(--panel2); font-size: 12px; }
    .muted { color: var(--muted); font-size: 13px; }
    @media (max-width: 760px){ .container{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>🤖 لوحة تحكم بوت واتساب</h1>
    <div id="status-badges"></div>
  </header>

  <div class="container">
    <!-- محاكي المحادثة -->
    <div class="card full">
      <h2>💬 محاكي المحادثة (جرّب البوت مباشرة)</h2>
      <div class="chat" id="chat"></div>
      <div class="input-row">
        <input id="msgInput" placeholder="اكتب رسالة... (جرّب: مرحبا، أو 0 للقائمة)" />
        <button onclick="sendMsg()">إرسال</button>
      </div>
      <p class="muted" style="margin-top:8px">المستخدم التجريبي: <span id="testUser">966500000000</span></p>
    </div>

    <!-- الإحصائيات -->
    <div class="card">
      <h2>📊 الإحصائيات</h2>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">إجمالي المستخدمين</div></div>
        <div class="stat"><div class="num" id="stat-active">0</div><div class="lbl">في القائمة</div></div>
        <div class="stat"><div class="num" id="stat-ai">0</div><div class="lbl">محادثة AI</div></div>
      </div>
    </div>

    <!-- حالة الاتصال -->
    <div class="card">
      <h2>🔌 حالة الاتصال</h2>
      <p class="muted">Instance: <span class="pill" id="conn-instance">—</span></p>
      <p class="muted" style="margin-top:8px">الحالة: <span class="pill" id="conn-state">—</span></p>
      <p class="muted" style="margin-top:8px">الذكاء الاصطناعي: <span class="pill" id="conn-ai">—</span></p>
    </div>

    <!-- آخر المستخدمين -->
    <div class="card full">
      <h2>👥 آخر المستخدمين النشطين</h2>
      <table>
        <thead><tr><th>المستخدم</th><th>الاسم</th><th>الحالة</th><th>الرسائل</th><th>آخر نشاط</th></tr></thead>
        <tbody id="users-tbody"><tr><td colspan="5" class="muted">لا يوجد نشاط بعد</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    const TEST_USER = '966500000000';
    document.getElementById('testUser').textContent = TEST_USER;
    const chatEl = document.getElementById('chat');

    function addMsg(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      chatEl.appendChild(d);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    async function sendMsg() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;
      addMsg(text, 'user');
      input.value = '';
      try {
        const res = await fetch('/api/test', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ from: TEST_USER, text, pushName: 'زائر تجريبي' })
        });
        const data = await res.json();
        (data.repliesSent || []).slice().reverse().forEach(r => {
          if (r.type === 'text') addMsg(r.text, 'bot');
          else if (r.type === 'buttons') {
            addMsg(r.title + '\n' + (r.buttons||[]).map(b=>`[${b.id}] ${b.title}`).join('\n'), 'bot');
          }
        });
        refresh();
      } catch (e) { addMsg('⚠️ خطأ في الاتصال بالخادم', 'bot'); }
    }

    document.getElementById('msgInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMsg();
    });

    async function refresh() {
      try {
        const [statsRes, healthRes, connRes] = await Promise.all([
          fetch('/api/stats').then(r=>r.json()),
          fetch('/health').then(r=>r.json()),
          fetch('/api/connection').then(r=>r.json()).catch(()=>({}))
        ]);

        const s = statsRes.sessions;
        document.getElementById('stat-total').textContent = s.total || 0;
        document.getElementById('stat-active').textContent = s.byState?.menu || 0;
        document.getElementById('stat-ai').textContent = s.byState?.ai_chat || 0;

        const tbody = document.getElementById('users-tbody');
        if (s.recent && s.recent.length) {
          tbody.innerHTML = s.recent.map(u => `
            <tr>
              <td>${u.userId}</td>
              <td>${u.name || '—'}</td>
              <td><span class="pill">${u.state}</span></td>
              <td>${u.messages}</td>
              <td class="muted">${new Date(u.lastActiveAt).toLocaleString('ar')}</td>
            </tr>`).join('');
        }

        // الشارات
        const badges = document.getElementById('status-badges');
        badges.innerHTML =
          `<span class="badge ${healthRes.status==='ok'?'on':'off'}">${healthRes.status==='ok'?'● متصل':'● غير متصل'}</span> ` +
          (healthRes.simulation ? '<span class="badge on">وضع المحاكاة</span>' : '');

        document.getElementById('conn-instance').textContent = healthRes.instance || '—';
        document.getElementById('conn-state').textContent = connRes.state || connRes.instance?.state || (healthRes.simulation?'simulation':'—');
        document.getElementById('conn-ai').textContent = healthRes.aiEnabled ? 'مُفعّل ✅' : 'معطّل';
      } catch(e) {}
    }

    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
